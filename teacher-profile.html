<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OpenTime-your acccount</title>

</head>
<body>
<header>
    <h2>Your teacher profile</h2>
</header>
<main>

        <button type="button" id="info-tab-button" data-tab="info">Info</button>

    </div>
    <div id="consultations-tab" data-tab="consultations" style="display: none;" class="tab">
        Consultations Content
    </div>
    <div id="settings-tab" data-tab="settings" style="display: none;" class="tab">
        Settings Content
    </div>

</html>
